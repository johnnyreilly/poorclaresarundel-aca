name: Container

on:
  # pushes to main are built (and deployed) by the Deploy workflow
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a pull request cancels the run for the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container-build:
    uses: ./.github/workflows/util-build-and-deploy.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      deploy: false
      branchName: ${{ github.head_ref || github.ref_name }}
    # no secrets: this only builds and smoke tests the image
