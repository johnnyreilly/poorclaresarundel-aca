name: Container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-build:
    uses: ./.github/workflows/util-build-and-deploy.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      deploy: false
      branchName: ${{ github.head_ref || github.ref_name }}
    secrets: inherit
