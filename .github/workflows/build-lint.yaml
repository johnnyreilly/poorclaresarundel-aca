name: Build and lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a pull request cancels the run for the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_lint:
    # keeps the check names "client build and test ⚙️" and "server build and test ⚙️"
    name: ${{ matrix.project }} build and test ⚙️
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [client, server]
    defaults:
      run:
        working-directory: src/${{ matrix.project }}
    steps:
      - name: Checkout 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # the pnpm version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      # the Node.js version comes from .nvmrc
      - name: Setup Node.js 🔧
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: src/${{ matrix.project }}/pnpm-lock.yaml

      - name: install
        run: pnpm i --frozen-lockfile

      - name: build
        run: pnpm run build

      - name: lint
        run: pnpm run lint
