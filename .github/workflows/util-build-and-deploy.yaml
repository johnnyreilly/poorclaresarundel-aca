name: Build and deploy

on:
  workflow_call:
    inputs:
      deploy:
        required: true
        type: boolean
      branchName:
        required: true
        type: string

    outputs:
      containerAppUrl:
        description: "The URL of the deployed container app"
        value: ${{ jobs.deploy.outputs.containerAppUrl }}

env:
  RESOURCE_GROUP: rg-poorclaresarundel
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-name: ${{ steps.vars.outputs.image_name }}
      sha-short: ${{ steps.vars.outputs.sha_short }}
      built-at: ${{ steps.vars.outputs.built_at }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branchName }}

      - name: Set sha-short and image-name environment variables
        id: vars
        run: |
          image_name=$(echo "${{ env.REGISTRY }}/${{ github.repository }}/node-service" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$image_name" >> $GITHUB_OUTPUT
          # 7 characters, to match the `type=sha` tag that docker/metadata-action generates
          sha_short=$(git rev-parse --short=7 HEAD)
          echo "sha_short=$sha_short" >> $GITHUB_OUTPUT
          echo "built_at=$(date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_OUTPUT

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.vars.outputs.image_name }}
          context: git # so it uses the git branch that is checked out
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      # Build and push Docker image with Buildx (don't push if deploy is false)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./
          push: ${{ inputs.deploy }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # reuse image layers between runs through the GitHub Actions cache;
          # mode=max also caches the intermediate build stages
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_BRANCH_NAME=${{ inputs.branchName }}
            VITE_GIT_SHA=${{ steps.vars.outputs.sha_short }}
            VITE_BUILT_AT=${{ steps.vars.outputs.built_at }}

      # Start the image that was just built and check that the server responds
      - name: Smoke test the container
        env:
          IMAGE: ${{ steps.vars.outputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}
        run: |
          docker run --detach --name smoke-test --publish 3000:3000 "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:3000/api/status; then
              echo
              echo "Container responded on attempt $attempt"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not respond on /api/status"
          docker logs smoke-test
          exit 1

  deploy:
    runs-on: ubuntu-latest
    if: inputs.deploy == true
    needs: build
    # one deployment at a time to each container app; a second one waits.
    # runs that do not deploy get a group of their own, so they never queue
    concurrency:
      group: ${{ inputs.deploy && format('deploy-{0}', inputs.branchName == 'main' && 'main-web' || 'preview-web') || format('no-deploy-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      containerAppUrl: ${{ steps.deploy.outputs.CONTAINER_APP_URL }}
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branchName }}

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        id: deploy
        env:
          BRANCH_NAME: ${{ inputs.branchName }}
          BUILT_AT: ${{ needs.build.outputs.built-at }}
          SHA_SHORT: ${{ needs.build.outputs.sha-short }}
          IMAGE_NAME: ${{ needs.build.outputs.image-name }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.PACKAGES_TOKEN }}
          APPSETTINGS_API_KEY: ${{ secrets.APPSETTINGS_API_KEY }}
          APPSETTINGS_DOMAIN: ${{ vars.APPSETTINGS_DOMAIN }}
          APPSETTINGS_PRAYER_REQUEST_FROM_EMAIL: ${{ vars.APPSETTINGS_PRAYER_REQUEST_FROM_EMAIL }}
          APPSETTINGS_PRAYER_REQUEST_RECIPIENT_EMAIL: ${{ vars.APPSETTINGS_PRAYER_REQUEST_RECIPIENT_EMAIL }}
        run: |
          REF_SHA="$BRANCH_NAME.$SHA_SHORT"
          DEPLOYMENT_NAME="${REF_SHA////-}"
          echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME"

          webServiceImage="$IMAGE_NAME:sha-$SHA_SHORT"
          echo "webServiceImage=$webServiceImage"

          if [ "$BRANCH_NAME" == "main" ]; then
            webServiceContainerAppName="main-web"
          else
            webServiceContainerAppName="preview-web"
          fi
          echo "webServiceContainerAppName=$webServiceContainerAppName"

          TAGS='{"owner":"johnnyreilly", "email":"johnny_reilly@hotmail.com"}'
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --template-file ./infra/main.bicep \
            --parameters \
                webServiceImage="$webServiceImage" \
                containerRegistry="$REGISTRY" \
                containerRegistryUsername="$REGISTRY_USERNAME" \
                containerRegistryPassword="$REGISTRY_PASSWORD" \
                branchName="$BRANCH_NAME" \
                gitSha="$SHA_SHORT" \
                builtAt="$BUILT_AT" \
                workspaceName='shared-log-analytics' \
                appInsightsName='shared-app-insights' \
                managedEnvironmentName='shared-env' \
                webServiceContainerAppName="$webServiceContainerAppName" \
                tags="$TAGS" \
                APPSETTINGS_API_KEY="$APPSETTINGS_API_KEY" \
                APPSETTINGS_DOMAIN="$APPSETTINGS_DOMAIN" \
                APPSETTINGS_PRAYER_REQUEST_FROM_EMAIL="$APPSETTINGS_PRAYER_REQUEST_FROM_EMAIL" \
                APPSETTINGS_PRAYER_REQUEST_RECIPIENT_EMAIL="$APPSETTINGS_PRAYER_REQUEST_RECIPIENT_EMAIL"

          CONTAINER_APP_URL=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$webServiceContainerAppName" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "CONTAINER_APP_URL=$CONTAINER_APP_URL"
          echo "CONTAINER_APP_URL=$CONTAINER_APP_URL" >> "$GITHUB_OUTPUT"
