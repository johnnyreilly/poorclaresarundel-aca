name: Deploy
on:
  # Trigger the workflow on push to the main branch
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    uses: ./.github/workflows/util-build-and-deploy.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      deploy: true
      branchName: ${{ github.ref_name }}
    secrets: inherit
