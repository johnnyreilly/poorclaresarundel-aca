name: Server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a pull request cancels the run for the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server_build_and_test_job:
    runs-on: ubuntu-latest
    name: server build and test ⚙️
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: src/server/pnpm-lock.yaml

      - name: server install
        working-directory: src/server
        run: pnpm i --frozen-lockfile

      - name: server build
        working-directory: src/server
        run: pnpm run build

      - name: server lint
        working-directory: src/server
        run: pnpm run lint
