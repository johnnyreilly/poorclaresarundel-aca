name: Pull request commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  check-command:
    # only a comment on a pull request, that starts with `/deploy`,
    # written by someone with write access to the repository, deploys
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/deploy') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "/deploy requested by $COMMENT_AUTHOR"
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}

  get-pr-branch-name:
    needs: check-command
    uses: ./.github/workflows/util-get-pr-branch-name.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      pullRequestNumber: ${{ github.event.issue.number }}

  pre-deploy:
    needs: check-command
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - run: |
          gh issue comment "$PR_NUMBER" --body "Preview environment [deploying]($RUN_URL)..." --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy:
    needs: [get-pr-branch-name, pre-deploy]
    uses: ./.github/workflows/util-build-and-deploy.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      deploy: true
      branchName: ${{ needs.get-pr-branch-name.outputs.branchName }}
    # only the secrets that the deploy job uses
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      APPSETTINGS_API_KEY: ${{ secrets.APPSETTINGS_API_KEY }}

  post-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    permissions:
      issues: write
      pull-requests: write
    steps:
      - run: |
          gh issue comment "$PR_NUMBER" --body "Preview environment deployed: https://$CONTAINER_APP_URL" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CONTAINER_APP_URL: ${{ needs.deploy.outputs.containerAppUrl }}

  # say so on the pull request when the preview deploy did not succeed
  deploy-failed:
    if: ${{ always() && needs.check-command.result == 'success' && needs.deploy.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check-command, deploy]
    permissions:
      issues: write
      pull-requests: write
    steps:
      - run: |
          gh issue comment "$PR_NUMBER" --body "Preview environment was not deployed: the [run]($RUN_URL) ended as $DEPLOY_RESULT." --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
